[package]
name = "mellivorex_player"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Mellivorex Player — standalone graphical game player"

[[bin]]
name = "mellivorex_player"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "wayland",
    "x11",
    "default_fonts",
    "system_fonts",
    "clipboard",
    "links",
    "accesskit",
    "persistence",
] }
egui = "0.37"
mellivorex_rs = { path = "../mellivorex_rs", version = "5.0.0" }
mellivorex_ui = { path = "../mellivorex_ui", version = "5.0.0" }
rfd = "0.17"
