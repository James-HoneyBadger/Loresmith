[package]
name = "loresmith_player"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Loresmith Player — standalone graphical game player"

[[bin]]
name = "loresmith_player"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "wayland",
    "x11",
    "default_fonts",
    "system_fonts",
    "clipboard",
    "links",
    "accesskit",
    "persistence",
] }
egui = "0.37"
loresmith_rs = { path = "../loresmith_rs", version = "6.0.4" }
loresmith_ui = { path = "../loresmith_ui", version = "6.0.4" }
rfd = "0.17"

[dev-dependencies]
egui_kittest = "0.37"
