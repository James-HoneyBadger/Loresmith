name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            archive: tar.gz
          - os: macos-latest
            target: macos-aarch64
            archive: tar.gz
          - os: windows-latest
            target: windows-x86_64
            archive: zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --locked --workspace

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp target/release/loresmith_player dist/
          cp target/release/loresmith_console dist/
          cp target/release/loresmith_workbench dist/
          cp target/release/loresmith_studio dist/
          cp README.md LICENSE CHANGELOG.md dist/
          cp -r examples dist/
          tar -czf "Loresmith-v${version}-${{ matrix.target }}.tar.gz" -C dist .

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/loresmith_player.exe dist/
          Copy-Item target/release/loresmith_console.exe dist/
          Copy-Item target/release/loresmith_workbench.exe dist/
          Copy-Item target/release/loresmith_studio.exe dist/
          Copy-Item README.md, LICENSE, CHANGELOG.md dist/
          Copy-Item -Recurse examples dist/
          Compress-Archive -Path dist/* -DestinationPath "Loresmith-v$version-${{ matrix.target }}.zip"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Loresmith-v*-${{ matrix.target }}.${{ matrix.archive }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
