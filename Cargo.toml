[workspace]
resolver = "2"
members = [
  "mellivorex_rs",
  "mellivorex_ui",
  "mellivorex_player",
  "mellivorex_console",
  "mellivorex_workbench",
  "mellivorex_studio",
]

[workspace.package]
version = "5.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["James Honey-Badger"]
repository = "https://github.com/James-HoneyBadger/Mellivorex"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
