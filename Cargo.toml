[workspace]
resolver = "2"
members = [
  "loresmith_rs",
  "loresmith_ui",
  "loresmith_player",
  "loresmith_console",
  "loresmith_workbench",
  "loresmith_studio",
]

[workspace.package]
version = "6.0.4"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["James Honey-Badger"]
repository = "https://github.com/James-HoneyBadger/Loresmith"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
