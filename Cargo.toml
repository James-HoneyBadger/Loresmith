[workspace]
resolver = "2"
members = [
  "sagacraft_rs",
  "sagacraft_ui",
  "sagacraft_play",
  "sagacraft_player",
  "sagacraft_ide_tui",
  "sagacraft_ide_gui",
]

[workspace.package]
version = "4.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["James Honey-Badger"]
repository = "https://github.com/James-HoneyBadger/SagaCraft"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
