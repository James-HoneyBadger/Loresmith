[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2026-0370", reason = "zvariant is pulled in by the optional accesskit accessibility stack via atspi; no fixed release is available and it is not exposed to adventure input" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names is pulled in by the optional accesskit accessibility stack via atspi; no fixed release is available and it is not exposed to adventure input" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is pulled in by the optional accesskit accessibility stack via atspi; no fixed release is available and it is not exposed to adventure input" },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "CC0-1.0", "Unlicense", "BSL-1.0", "OFL-1.1", "Ubuntu-font-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
